 before asking</text><text x="430" y="288" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="14.5" fill="#e6edf3" text-anchor="start">the kernel again, split big chunks and</text><text x="430" y="308" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="14.5" fill="#e6edf3" text-anchor="start">coalesce free neighbours.</text></svg>